[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascaded-rs-detection"
version = "0.1.0"
description = "Cascaded object detection for remote sensing imagery: gate + OBB detector, with systematic study of compute-accuracy frontier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0,<8.5.0",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "torch>=2.0",
  "torchvision>=0.15",
  "tqdm>=4.65",
  "timm>=1.0",
  "scikit-learn>=1.4",
  "shapely>=2.0",
  "netcal>=1.3",
  "wandb>=0.16",
  "albumentations>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
